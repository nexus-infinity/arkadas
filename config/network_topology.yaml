# Network Topology - Friend Network Structure

network:
  name: "ARKADAS_Friend_Network"
  type: "distributed"
  protocol: "DAL"  # Distributed Agent Learning
  
topology:
  structure: "mesh"  # mesh, star, ring, hybrid
  max_connections_per_node: 10
  min_trust_for_connection: 0.3
  auto_discover: true
  
nodes:
  default_capabilities:
    - "sensing"
    - "learning"
    - "communication"
    - "collaboration"
    
  trust_defaults:
    initial_trust: 0.5
    trust_decay_rate: 0.01  # per day
    trust_growth_rate: 0.05  # per positive interaction
    
coordination:
  consensus_threshold: 0.6
  decision_timeout: 30  # seconds
  quorum_size: 3  # minimum participants for collective decision
  
emergence:
  min_participants_for_behavior: 3
  behavior_strength_threshold: 0.5
  collective_memory_size: 1000
  
obi_wan:
  sensor_array_size: 36  # sensors
  sensing_range: 360  # degrees
  update_frequency: 1.0  # Hz
  
integration:
  train_station:
    enabled: true
    track_count: 4
    max_train_queue: 100
    
  dojo:
    enabled: true
    auto_skill_registration: true
    session_timeout: 3600  # seconds
    
  jefferies_tubes:
    channel_count: 8
    default_bandwidth: 100  # pulses/second
    sync_frequency: 1.0  # Hz
    
  trident:
    enabled: true
    strict_mode: false
    validation_timeout: 10  # seconds
