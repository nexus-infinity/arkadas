[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arkadas"
version = "0.1.0"
description = "ARKADAŠ - The King's Chamber | Organic ⚭ Digital Synchronization | 360° sensing → 180° focus"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["arkadas", "friend-network", "synchronization", "sacred-geometry", "obi-wan"]
authors = [
    {name = "NEXUS-INFINITY"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
arkadas = "arkadas.cli:main"

[tool.setuptools]
packages = ["arkadas"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
